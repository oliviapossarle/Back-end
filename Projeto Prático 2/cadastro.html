<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Cadastro</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a> | <a href="produtos.html">Produtos</a> | <a href="cadastro.html">Cadastro</a> | <a href="login.html">Login</a> | <a href="quem-somos.html">Quem Somos</a>
    </nav>
    <main>
        <h2>Cadastro</h2>
        <form action="#" method="post" enctype="multipart/form-data">
            <label for="nome">Nome:</label> <input type="text" id="nome" minlength="5" required><br><br>
            <label for="email">E-mail:</label> <input type="email" id="email" required><br><br>
            <label for="tel">Celular:</label> <input type="tel" id="tel" pattern="\[0-9]{2}\ [0-9]{5}-[0-9]{4}" title="(XX) XXXXX-XXXX"><br><br>
            
            <label>Tipo:</label>
            <input type="radio" id="masculino" name="t" checked><label for="masculino">Masculino</label>
            <input type="radio" id="feminino" name="t"><label for="feminino">Feminino</label><br><br>
            
            <label for="estado">Estado:</label>
            <select id="estado"><option>SP</option><option>RJ</option></select><br><br>

            <input type="checkbox" id="trm" required><label for="trm">Aceito os termos</label><br><br>
            <button type="submit">Enviar</button> <button type="reset">Limpar</button>
        </form>
    </main>
</body>
</html>
